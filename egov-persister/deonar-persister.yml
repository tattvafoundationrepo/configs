            - jsonPath: $.gatePassDetails.vehicleNumber
            - jsonPath: $.gatePassDetails.receiverName
            - jsonPath: $.gatePassDetails.receiverContact
            - jsonPath: $.gatePassDetails.total
            - jsonPath: $.gatePassDetails.gatePassReference
            - jsonPath: $.gatePassDetails.shopkeeper
            - jsonPath: $.gatePassDetails.auditDetails.createdTime
            - jsonPath: $.gatePassDetails.auditDetails.lastModifiedTime
            - jsonPath: $.gatePassDetails.auditDetails.createdBy
            - jsonPath: $.gatePassDetails.auditDetails.lastModifiedBy



    - version: 1.0
      description: Persists Raised Penalty Records
      fromTopic: topic_deonar_savepenalty
      isTransaction: true
      queryMaps:
        - query: |
            INSERT INTO eg_deonar_raised_penalties 
            (stakeholderid,  penaltyid, amount, penalty_reference, is_paid, createddate, lastmodifieddate, createdby, lastmodifiedby, unit)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
          basePath: $
          jsonMaps:
            - jsonPath: $.stakeholderId
            - jsonPath: $.penaltyId
            - jsonPath: $.amount
            - jsonPath: $.penaltyReference
            - jsonPath: $.isPaid
            - jsonPath: $.auditDetails.createdTime
            - jsonPath: $.auditDetails.lastModifiedTime
            - jsonPath: $.auditDetails.createdBy
            - jsonPath: $.auditDetails.lastModifiedBy
            - jsonPath: $.units       
    
        
    - version: 1.0
      description: Persists Deonar Slaughtered Animals Records and associated data
      fromTopic: topic_deonar_slaughtered_animals
      isTransaction: true
      queryMaps:
        - query: |
            INSERT INTO public.eg_deonar_slaughtered_animals 
            (arrivalid, ddreference, shopkeepername, licencenumber, animaltypeid, "token", slaughtering, slaughterunit, slaughtertype, createdon, modifiedon, createdby, modifiedby)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
          basePath: $
          jsonMaps:
