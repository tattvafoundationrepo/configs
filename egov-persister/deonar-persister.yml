            - jsonPath: $.slaughterDetails.ddReference                
            - jsonPath: $.slaughterDetails.shopkeeperName             
            - jsonPath: $.slaughterDetails.licenceNumber              
            - jsonPath: $.slaughterDetails.animalTypeId               
            - jsonPath: $.slaughterDetails.token                      
            - jsonPath: $.slaughterDetails.slaughtering               
            - jsonPath: $.slaughterDetails.slaughterUnit              
            - jsonPath: $.slaughterDetails.slaughterType              
            - jsonPath: $.audit.createdTime          
            - jsonPath: $.audit.lastModifiedTime     
            - jsonPath: $.audit.createdBy            
            - jsonPath: $.audit.lastModifiedBy       



        
