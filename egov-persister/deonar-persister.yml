             ON CONFLICT (mobilenumber) DO UPDATE SET
                stakeholdername = EXCLUDED.stakeholdername,
                address1 = EXCLUDED.address1,
                address2 = EXCLUDED.address2,
                pincode = EXCLUDED.pincode,
                contactnumber = EXCLUDED.contactnumber,
                email = EXCLUDED.email,
                updatedat = EXCLUDED.updatedat,
                updatedby = EXCLUDED.updatedby;
          basePath: $
          jsonMaps:
            - jsonPath: $.Stakeholders.stakeholderName
            - jsonPath: $.Stakeholders.address1
            - jsonPath: $.Stakeholders.address2
            - jsonPath: $.Stakeholders.pincode
            - jsonPath: $.Stakeholders.mobileNumber
            - jsonPath: $.Stakeholders.contactNumber
            - jsonPath: $.Stakeholders.email
            - jsonPath: $.Stakeholders.createdAt
            - jsonPath: $.Stakeholders.updatedAt
            - jsonPath: $.Stakeholders.createdBy
            - jsonPath: $.Stakeholders.updatedBy    
        - query: >
            INSERT INTO public.eg_deonar_stakeholder_type_mapping (
                stakeholdertypeid, stakeholderid, createdat, updatedat, createdby, updatedby
            ) VALUES (?, 
            (SELECT id FROM public.eg_deonar_stakeholder WHERE mobilenumber = ? LIMIT 1),
             ?, ?, ?, ?
             )
             ON CONFLICT (stakeholderid, stakeholdertypeid) 
             DO UPDATE SET
                createdat = EXCLUDED.createdat,
                updatedat = EXCLUDED.updatedat,
                createdby = EXCLUDED.createdby,
                updatedby = EXCLUDED.updatedby;
          basePath: $
          jsonMaps:
            - jsonPath: $.Stakeholders.stakeholderTypeId
            - jsonPath: $.Stakeholders.mobileNumber
            - jsonPath: $.Stakeholders.createdAt
            - jsonPath: $.Stakeholders.updatedAt
            - jsonPath: $.Stakeholders.createdBy
            - jsonPath: $.Stakeholders.updatedBy


