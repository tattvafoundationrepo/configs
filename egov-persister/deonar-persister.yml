            INSERT INTO public.eg_deonar_gatepass_details (
              animaldetails , vehicle_number, receiver_name, receiver_contact, 
              total, reference_number, shopkeeper, createdtime, 
              modofiedtime, createdby, modifiedby
            ) VALUES (?::jsonb, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
          basePath: $
