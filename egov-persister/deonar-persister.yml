serviceMaps:
  serviceName: deonar-services
  mappings:
    - version: 1.0
      description: Persists Deonar arrival details
      fromTopic: topic_deonar_arrival
      isTransaction: true
      queryMaps:
        - query: |
            INSERT INTO eg_deonar_arrival 
            (arrivalId, importPermission, stakeholderId, permissiondate, timeOfArrival, vehicleNumber, createdAt, updatedAt, createdBy, updatedBy, licencenumber)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            ON CONFLICT (arrivalId)
            DO UPDATE SET 
              importPermission = EXCLUDED.importPermission,
              stakeholderId = EXCLUDED.stakeholderId,
              permissiondate = EXCLUDED.permissiondate,
              timeOfArrival = EXCLUDED.timeOfArrival,
              vehicleNumber = EXCLUDED.vehicleNumber,
              updatedAt = EXCLUDED.updatedAt,
              updatedBy = EXCLUDED.updatedBy
            RETURNING id;
          basePath: $.ArrivalDetails
          jsonMaps:
            - jsonPath: $.ArrivalDetails.arrivalId
            - jsonPath: $.ArrivalDetails.importPermission
            - jsonPath: $.ArrivalDetails.stakeholderId
            - jsonPath: $.ArrivalDetails.permissionDate
            - jsonPath: $.ArrivalDetails.timeOfArrival
            - jsonPath: $.ArrivalDetails.vehicleNumber
            - jsonPath: $.ArrivalDetails.createdAt
            - jsonPath: $.ArrivalDetails.updatedAt
            - jsonPath: $.ArrivalDetails.createdBy
            - jsonPath: $.ArrivalDetails.updatedBy
            - jsonPath: $.ArrivalDetails.licenceNumber


        - query: |
            INSERT INTO eg_deonar_animal_at_arrival 
            (arrivalId, animalTypeId, token, createdAt, updatedAt, createdBy, updatedBy)
            VALUES ((SELECT id FROM eg_deonar_arrival WHERE arrivalId = ?), ?, ?, ?, ?, ?, ?)
            ON CONFLICT (arrivalId, animalTypeId,token)
            DO UPDATE SET
              updatedAt = EXCLUDED.updatedAt,
              updatedBy = EXCLUDED.updatedBy;
          basePath: $.saveAnimalDetails.*
          jsonMaps:
            - jsonPath: $.ArrivalDetails.arrivalId
            - jsonPath: $.saveAnimalDetails.*.animalTypeId
            - jsonPath: $.saveAnimalDetails.*.tokenNum
            - jsonPath: $.saveAnimalDetails.*.createdAt
            - jsonPath: $.saveAnimalDetails.*.updatedAt
            - jsonPath: $.saveAnimalDetails.*.createdBy
            - jsonPath: $.saveAnimalDetails.*.updatedBy
  

    - version: 1.0
      description: Persists Deonar Inspection details
      fromTopic: save-inspection-detailsold
      isTransaction: true
      queryMaps:
        - query: |
            INSERT INTO eg_deonar_inspection
            (inspectiondate, inspectiontime, arrivalid, employeeid, createdat, updatedat, createdby, updatedby, inspectionunitid, inspectiontype)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            ON CONFLICT (arrivalid,inspectiontype)
            DO UPDATE SET 
              inspectiontime = EXCLUDED.inspectiontime,
              arrivalid = EXCLUDED.arrivalid,
              employeeid = EXCLUDED.employeeid,
              updatedat = EXCLUDED.updatedat,
              updatedby = EXCLUDED.updatedby,
              inspectionunitid = EXCLUDED.inspectionunitid,
              inspectiontype = EXCLUDED.inspectiontype
            RETURNING id;
          basePath: $
          jsonMaps:
            - jsonPath: $.Inspection.inspectionDate
            - jsonPath: $.Inspection.inspectionTime
            - jsonPath: $.Inspection.arrivalId
            - jsonPath: $.Inspection.employeeId
            - jsonPath: $.Inspection.createdAt
            - jsonPath: $.Inspection.updatedAt
            - jsonPath: $.Inspection.createdBy
            - jsonPath: $.Inspection.updatedBy
            - jsonPath: $.Inspection.inspectionUnitId
            - jsonPath: $.Inspection.inspectionType

        - query: |
            With Data as(
            Select result,defaultremark,other,opinion
            ,b.animaltypeid,
            b.token
            from eg_deonar_default_inspection_record a 
            left join eg_deonar_animal_at_arrival b on a.animaltypeid = b.animaltypeid
            where  type = ? and b.arrivalid in (select id from eg_deonar_arrival where arrivalid =?))
            INSERT INTO eg_deonar_inspection_detail
              (inspectionid,report,"resultremark",other,opinion,tokenno, animaltypeid,createdat, updatedat, createdby, updatedby,quarters)
            SELECT 
              ei.id, result,defaultremark,other,opinion,token,animaltypeid,?,?,?,?,case when ei.inspectiontype = 4 then  case when data.animalTypeId = 3 then 4 else 1 end else null end
            FROM eg_deonar_inspection ei, data where ei.inspectiontype = ? and ei.arrivalid = ?
          basePath: $
          jsonMaps:
            - jsonPath: $.Inspection.inspectionType
            - jsonPath: $.Inspection.arrivalId
            - jsonPath: $.Inspection.createdAt
            - jsonPath: $.Inspection.updatedAt 
            - jsonPath: $.Inspection.createdBy
            - jsonPath: $.Inspection.updatedBy
            - jsonPath: $.Inspection.inspectionType
            - jsonPath: $.Inspection.arrivalId



    - version: 1.0
      description: Persists Deonar Inspection details
      fromTopic: save-inspection-details
      isTransaction: true
      queryMaps:
        - query: |
            INSERT INTO eg_deonar_inspection
            (inspectiondate, inspectiontime, arrivalid, employeeid, createdat, updatedat, createdby, updatedby, inspectionunitid, inspectiontype,inspection_against)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            ON CONFLICT (arrivalid,inspectiontype,inspection_against)
            DO UPDATE SET 
              inspectiontime = EXCLUDED.inspectiontime,
              employeeid = EXCLUDED.employeeid,
              updatedat = EXCLUDED.updatedat,
              updatedby = EXCLUDED.updatedby,
              inspectionunitid = EXCLUDED.inspectionunitid
            RETURNING id;
          basePath: $
          jsonMaps:
            - jsonPath: $.Inspection.inspectionDate
            - jsonPath: $.Inspection.inspectionTime
            - jsonPath: $.Inspection.arrivalId
            - jsonPath: $.Inspection.employeeId
            - jsonPath: $.Inspection.createdAt
            - jsonPath: $.Inspection.updatedAt
            - jsonPath: $.Inspection.createdBy
            - jsonPath: $.Inspection.updatedBy
            - jsonPath: $.Inspection.inspectionUnitId
            - jsonPath: $.Inspection.inspectionType
            - jsonPath: $.Inspection.inspectionAgainst

        - query: |
     
            INSERT INTO eg_deonar_inspection_detail
              (inspectionid,report,"resultremark",other,opinion,tokenno, animaltypeid,createdat, updatedat, createdby, updatedby,quarters)
            values(
              (select id from eg_deonar_inspection where arrivalid = ? and inspectiontype = ? LIMIT 1), ?::jsonb,?,?,?,?,?,?,?,?,?,case when ? = 4 then  case when ? = 3 then 4 else 1 end else null end )
          basePath: $
          jsonMaps:
            - jsonPath: $.Inspection.arrivalId
            - jsonPath: $.Inspection.inspectionType
            - jsonPath: $.InspectionDetails.jsonStringReport
            - jsonPath: $.InspectionDetails.resultremark
            - jsonPath: $.InspectionDetails.other
            - jsonPath: $.InspectionDetails.opinionId
            - jsonPath: $.InspectionDetails.animalDetail.token
            - jsonPath: $.InspectionDetails.animalDetail.animalTypeId
            - jsonPath: $.Inspection.createdAt
            - jsonPath: $.Inspection.updatedAt 
            - jsonPath: $.Inspection.createdBy
            - jsonPath: $.Inspection.updatedBy
            - jsonPath: $.Inspection.inspectionType
            - jsonPath: $.InspectionDetails.animalDetail.animalTypeId


    - version: 1.0
      description: Persists Deonar Inspection details
      fromTopic: update-inspection-details
      isTransaction: true
      queryMaps:
        - query: |
            UPDATE eg_deonar_inspection_detail SET  
              report=?::jsonb, resultremark=?, opinion=? , other = ? , updatedat=?,  updatedby=?, quarters=?
            WHERE inspectionid=( select id from eg_deonar_inspection where arrivalid = ? and inspectiontype = ? and inspection_against = ?) 
            and animaltypeid = ? and tokenno = ?
          basePath: $
          jsonMaps:
            - jsonPath: $.InspectionDetails.report
            - jsonPath: $.InspectionDetails.resultremark
            - jsonPath: $.InspectionDetails.opinionId
            - jsonPath: $.InspectionDetails.other
            - jsonPath: $.Inspection.updatedAt
            - jsonPath: $.Inspection.updatedBy
            - jsonPath: $.InspectionDetails.animalQuarters
            - jsonPath: $.InspectionDetails.entryUnitId
            - jsonPath: $.InspectionDetails.inspectionId
            - jsonPath: $.InspectionDetails.inspectionAgainst
            - jsonPath: $.InspectionDetails.animalTypeId
            - jsonPath: $.InspectionDetails.animalTokenNumber
    
    - version: 1.0
      description: Persists Deonar Inspection details
      fromTopic: update-Submit-flag
      isTransaction: true
      queryMaps:
        - query: |
            UPDATE eg_deonar_inspection SET  recordtype = true, inspection_against = ?
